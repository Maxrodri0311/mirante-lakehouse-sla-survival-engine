[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mirante-tecnologia-data-scientist-bridge-project"
version = "0.1.0"
description = "GP-170 - mirante_tecnologia_data_scientist_bridge_project: Mirante Tecnologia requires an enterprise-grade Causal & Survival Lifecycle Analytics architecture under Data Scientist ..."
authors = [
    { name = "Maximiliano Rodriguez", email = "maxrodri0311@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=0.9.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "pytest>=7.3.0",
    "lifelines>=0.28.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]